<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
Alumni Meet 2026 Check-In
</title>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

* {
  box-sizing:border-box;
}


body {

  margin:0;

  min-height:100vh;

  font-family:
    Arial,
    sans-serif;

  background:#f5f3ef;

  display:flex;

  justify-content:center;

  align-items:center;

}


.container {

  width:100%;

  max-width:500px;

  padding:20px;

}


.card {

  background:white;

  padding:25px;

  border-radius:20px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.12);

  text-align:center;

}


h1 {

  margin:0;

  font-size:27px;

}


.subtitle {

  margin-top:6px;

  margin-bottom:20px;

  color:#777;

}


.pin {

  width:150px;

  padding:12px;

  font-size:18px;

  text-align:center;

  border:1px solid #ccc;

  border-radius:8px;

  margin-bottom:15px;

}


#reader {

  width:100%;

  max-width:420px;

  margin:auto;

  overflow:hidden;

  border-radius:15px;

}


button {

  padding:14px 22px;

  margin:10px 4px;

  border:0;

  border-radius:10px;

  background:#222;

  color:white;

  font-size:16px;

}


button:disabled {

  opacity:.4;

}


#status {

  margin-top:10px;

  color:#777;

  min-height:22px;

}


#result {

  display:none;

  margin-top:20px;

  padding:20px;

  border-radius:15px;

}


.success {

  display:block !important;

  background:#e8f7ec;

  border:2px solid #3aa65c;

}


.duplicate {

  display:block !important;

  background:#fff4d6;

  border:2px solid #e2a900;

}


.invalid {

  display:block !important;

  background:#fde8e8;

  border:2px solid #d64545;

}


.error {

  display:block !important;

  background:#fde8e8;

  border:2px solid #d64545;

}


.icon {

  font-size:45px;

}


.title {

  font-size:21px;

  font-weight:bold;

  margin:8px 0;

}


.name {

  font-size:21px;

  font-weight:bold;

  margin-top:10px;

}


.batch {

  color:#555;

  margin-top:5px;

}


.ticket {

  color:#777;

  margin-top:7px;

  font-size:14px;

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<h1>
Alumni Meet 2026
</h1>


<div class="subtitle">
Guest Check-In
</div>


<input
  id="staffPin"
  class="pin"
  type="password"
  inputmode="numeric"
  placeholder="Staff PIN"
>


<div id="reader"></div>


<button
  id="start"
  onclick="startScanner()"
>

Start Scanner

</button>


<button
  id="stop"
  onclick="stopScanner()"
  disabled
>

Stop Scanner

</button>


<div id="status">

Enter PIN and start scanner.

</div>


<div id="result">


<div
  id="icon"
  class="icon">
</div>


<div
  id="title"
  class="title">
</div>


<div
  id="name"
  class="name">
</div>


<div
  id="batch"
  class="batch">
</div>


<div
  id="ticket"
  class="ticket">
</div>


<div id="message"></div>


</div>


</div>

</div>


<script>


/************************************************
 * PUT YOUR APPS SCRIPT /EXEC URL HERE
 ************************************************/

const API_URL =
  'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE';


let scanner = null;

let processing = false;


/************************************************
 * START
 ************************************************/

async function startScanner() {


  const pin =
    document
      .getElementById('staffPin')
      .value
      .trim();


  if (!pin) {

    setStatus(
      'Please enter the staff PIN.'
    );

    return;

  }


  if (
    API_URL ===
    'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE'
  ) {

    setStatus(
      'Scanner API URL has not been configured.'
    );

    return;

  }


  if (scanner) {

    return;

  }


  setStatus(
    'Starting camera...'
  );


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {

        fps:10,

        qrbox:{
          width:250,
          height:250
        }

      },

      onScanSuccess,

      function() {}

    );


    document
      .getElementById('start')
      .disabled = true;


    document
      .getElementById('stop')
      .disabled = false;


    setStatus(
      'Ready to scan.'
    );

  }

  catch(error) {

    console.error(error);

    scanner = null;

    setStatus(
      'Camera error: ' +
      (
        error.message ||
        error
      )
    );

  }

}


/************************************************
 * SCAN SUCCESS
 ************************************************/

function onScanSuccess(
  decodedText
) {


  if (processing) {

    return;

  }


  processing = true;


  const ticketId =
    String(decodedText)
      .trim()
      .toUpperCase();


  const pin =
    document
      .getElementById('staffPin')
      .value
      .trim();


  setStatus(
    'Checking ' +
    ticketId +
    '...'
  );


  stopScanner();


  const callback =
    'scannerCallback_' +
    Date.now();


  window[callback] =
    function(result) {

      handleResult(
        result
      );


      delete window[
        callback
      ];

    };


  const url =
    API_URL +
    '?action=checkin' +
    '&ticket=' +
    encodeURIComponent(
      ticketId
    ) +
    '&pin=' +
    encodeURIComponent(
      pin
    ) +
    '&callback=' +
    callback;


  const script =
    document.createElement(
      'script'
    );


  script.src =
    url;


  script.onerror =
    function() {

      handleResult({

        success:false,

        status:'error',

        message:
          'Could not connect to check-in server.'

      });

    };


  document.body.appendChild(
    script
  );

}


/************************************************
 * RESULT
 ************************************************/

function handleResult(
  result
) {


  const box =
    document.getElementById(
      'result'
    );


  box.className = '';


  if (
    result.status ===
    'success'
  ) {

    box.classList.add(
      'success'
    );


    document.getElementById(
      'icon'
    ).textContent = '✓';


    document.getElementById(
      'title'
    ).textContent =
      'CHECK-IN SUCCESSFUL';


    document.getElementById(
      'name'
    ).textContent =
      result.name || '';


    document.getElementById(
      'batch'
    ).textContent =
      'Batch: ' +
      (result.batch || '');


    document.getElementById(
      'ticket'
    ).textContent =
      'Ticket: ' +
      result.ticketId;


    document.getElementById(
      'message'
    ).textContent =
      result.message;


  }

  else if (
    result.status ===
    'duplicate'
  ) {

    box.classList.add(
      'duplicate'
    );


    document.getElementById(
      'icon'
    ).textContent = '⚠️';


    document.getElementById(
      'title'
    ).textContent =
      'ALREADY CHECKED IN';


    document.getElementById(
      'name'
    ).textContent =
      result.name || '';


    document.getElementById(
      'batch'
    ).textContent =
      'Batch: ' +
      (result.batch || '');


    document.getElementById(
      'ticket'
    ).textContent =
      'Ticket: ' +
      result.ticketId;


    document.getElementById(
      'message'
    ).textContent =
      result.message;


  }

  else {

    box.classList.add(
      result.status ===
      'error'
        ? 'error'
        : 'invalid'
    );


    document.getElementById(
      'icon'
    ).textContent = '✕';


    document.getElementById(
      'title'
    ).textContent =
      'CHECK-IN FAILED';


    document.getElementById(
      'name'
    ).textContent = '';


    document.getElementById(
      'batch'
    ).textContent = '';


    document.getElementById(
      'ticket'
    ).textContent =
      result.ticketId || '';


    document.getElementById(
      'message'
    ).textContent =
      result.message ||
      'Unknown error.';

  }


  box.style.display =
    'block';


  setStatus(
    'Ready for next guest.'
  );


  setTimeout(
    function() {

      processing = false;

    },
    1500
  );

}


/************************************************
 * STOP
 ************************************************/

async function stopScanner() {


  if (!scanner) {

    return;

  }


  try {

    await scanner.stop();

    await scanner.clear();

  }

  catch(error) {

    console.log(error);

  }


  scanner = null;


  document
    .getElementById('start')
    .disabled = false;


  document
    .getElementById('stop')
    .disabled = true;

}


/************************************************
 * STATUS
 ************************************************/

function setStatus(
  text
) {

  document
    .getElementById('status')
    .textContent =
      text;

}

</script>


</body>

</html>
